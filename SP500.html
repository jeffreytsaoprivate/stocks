
<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&amp;P500 vs. Index ETFs</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="SP500.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #10141b;
    --panel: #171d27;
    --panel-border: #262f3d;
    --text: #e7ebf2;
    --text-dim: #8996ab;
    --grid: #223047;
    --gspc: #5fb0e0;
    --qqq: #e0a85f;
    --tqqq: #e05f7e;
    --accent: #4fd1a5;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  .num, .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  header{
    padding: 28px clamp(16px,4vw,40px) 18px;
    border-bottom: 1px solid var(--panel-border);
    display:flex; flex-direction:column; gap:18px;
    position: sticky; top:0; z-index:10;
    background: linear-gradient(180deg, var(--bg) 80%, rgba(16,20,27,0.85));
    backdrop-filter: blur(6px);
  }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  h1{
    margin:0; font-size: clamp(20px, 2.4vw, 28px); font-weight:700; letter-spacing:-0.01em;
  }
  h1 .dim{ color:var(--text-dim); font-weight:500; }
  #asOf{ color:var(--text-dim); font-size:12.5px; }

  .controls{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .range-group{ display:inline-flex; background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:3px; gap:2px; }
  .range-btn{
    appearance:none; border:none; background:transparent; color:var(--text-dim);
    font-family:inherit; font-size:13px; font-weight:600; letter-spacing:.01em;
    padding:7px 14px; border-radius:6px; cursor:pointer; transition: background .15s, color .15s;
  }
  .range-btn:hover{ color: var(--text); }
  .range-btn.active{ background: var(--accent); color:#0b1710; }

  .roll-toggle{ display:inline-flex; background:#131822; border:1px solid var(--panel-border); border-radius:7px; padding:2px; gap:2px; margin-bottom:8px; }
  .roll-btn{
    appearance:none; border:none; background:transparent; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 9px; border-radius:5px; cursor:pointer; transition: background .15s, color .15s;
  }
  .roll-btn:hover{ color: var(--text); }
  .roll-btn.active{ background: var(--accent); color:#0b1710; }

  .ticker-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:baseline; gap:8px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:8px 12px; min-width: 150px;
  }
  .chip .swatch{ width:8px; height:8px; border-radius:50%; flex:none; }
  .chip .sym{ font-weight:700; font-size:13px; }
  .chip .px{ font-size:13px; margin-left:auto; }
  .chip .chg{ font-size:12px; font-weight:600; }
  .up{ color:#59d19a; } .down{ color:#e2687e; }

  main{ padding: 22px clamp(16px,4vw,40px) 60px; display:flex; flex-direction:column; gap:34px; }

  .row-label{
    display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;
  }
  .row-label .idx{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--bg); background:var(--text-dim);
    border-radius:4px; padding:2px 6px; font-weight:600;
  }
  .row-label h2{ font-size:15px; margin:0; font-weight:600; }
  .row-label p{ margin:2px 0 0; font-size:12.5px; color:var(--text-dim); }
  .row-label-wrap{ display:flex; flex-direction:column; }

  .horizon-control{ display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:8px 14px; margin:0 0 16px; width:fit-content; }
  .horizon-control label{ font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .horizon-control input[type=range]{
    -webkit-appearance:none; appearance:none; width:150px; height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--fill,30%), #263143 var(--fill,30%), #263143 100%);
    outline:none; cursor:pointer;
  }
  .horizon-control input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid #0b1710; margin-top:0;
  }
  .horizon-control input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid #0b1710;
  }
  .horizon-control input[type=range]::-moz-range-track{ background:#263143; height:4px; border-radius:2px; }
  .horizon-control .horizon-val{ font-size:13px; font-weight:700; color:var(--accent); min-width:28px; text-align:right; }

  .grid3{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  .grid2{ display:grid; grid-template-columns: repeat(2, 1fr); gap:16px; }
  @media (max-width: 980px){ .grid3{ grid-template-columns: 1fr; } .grid2{ grid-template-columns:1fr; } }

  .panel{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    padding:14px 14px 10px;
    display:flex; flex-direction:column;
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .panel-head .sym{ font-weight:700; font-size:13.5px; }
  .panel-head .sub{ font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
  .chart-wrap{ position:relative; height:230px; }
  .chart-wrap.tall{ height:260px; }

  .legend-row{ display:flex; gap:6px 14px; flex-wrap:wrap; margin-top:8px; font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
  .legend-row span{ display:inline-flex; align-items:center; gap:5px; }
  .legend-row i{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .legend-row.grad i{ border-radius:50%; }

  .date-panel{ justify-content:flex-start; }
  .date-panel canvas{ cursor: crosshair; }
  .date-hint{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:4px; }
  .date-current{ font-size:19px; font-weight:700; margin: 10px 0 14px; }
  .date-readout{ display:flex; flex-direction:column; gap:8px; }
  .date-readout-row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .date-readout-row .lbl{ display:flex; align-items:center; gap:7px; color:var(--text-dim); }
  .date-readout-row .lbl i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .date-readout-row .val{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .date-nudge{ display:flex; gap:8px; margin-top:16px; }
  .date-nudge button{
    flex:1; appearance:none; border:1px solid var(--panel-border); background:#131822; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:7px 0; border-radius:6px; cursor:pointer;
  }
  .date-nudge button:hover{ color:var(--text); border-color:#3a475f; }

  footer{ padding: 0 clamp(16px,4vw,40px) 30px; color:var(--text-dim); font-size:11.5px; }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>S&amp;P500 <span class="dim">vs.</span> Index ETFs <span class="dim">performance</span></h1>
    <div id="asOf" class="mono"></div>
  </div>
  <div class="controls">
    <div class="range-group" id="rangeGroup">
      <button class="range-btn" data-range="all">All data</button>
      <button class="range-btn" data-range="10y">Last 10 years</button>
      <button class="range-btn" data-range="5y">Last 5 years</button>
      <button class="range-btn" data-range="3y">Last 3 years</button>
      <button class="range-btn" data-range="1y">Last year</button>
    </div>
    <div class="ticker-row" id="tickerRow"></div>
  </div>
</header>

<main>
  <section>
    <div class="row-label">
      <span class="idx">ROW 1</span>
      <div class="row-label-wrap">
        <h2>Price</h2>
        <p>Adjusted close</p>
      </div>
    </div>
    <div class="grid3" id="priceRow"></div>
  </section>

  <section>
    <div class="row-label">
      <span class="idx">ROW 2</span>
      <div class="row-label-wrap">
        <h2>CAGR over different time windows</h2>
        <p id="row2Sub">Trailing 3y CAGR</p>
      </div>
    </div>
    <div class="horizon-control">
      <label for="horizonSlider">Time horizon</label>
      <input type="range" id="horizonSlider" min="1" max="10" step="1" value="3">
      <span class="horizon-val mono" id="horizonVal">3y</span>
      <div class="roll-toggle" id="distModeGroup" style="margin:0 0 0 10px;">
        <button type="button" class="roll-btn active" data-mode="normalized">% of windows</button>
        <button type="button" class="roll-btn" data-mode="counts">Counts</button>
      </div>
    </div>
    <div class="grid3" id="distRow"></div>
  </section>

  <section>
    <div class="row-label">
      <span class="idx">ROW 3</span>
      <div class="row-label-wrap">
        <h2>Correlation to S&amp;P500</h2>
        <p>Correlation with S&amp;P500</p>
      </div>
    </div>
    <div class="grid3" id="scatterRow"></div>
  </section>
</main>

<footer>
  Data source: Yahoo Finance
</footer>

<script>
const loadScript = function loadScript(url, callback) {
    // Add timestamp to prevent caching on refresh
    const cacheBuster = '?v=' + new Date().getTime();
    const script = document.createElement('script');
    
    script.src = url + cacheBuster;
    script.async = true;
    
    script.onload = function() {
        if (callback) callback();
    };
    
    document.head.appendChild(script);
};

// Usage


function main(){
  if (typeof Chart === 'undefined') {
    document.body.innerHTML = '<p style="padding:40px;color:#e2687e;font-family:monospace">Chart.js failed to load from https://cdn.jsdelivr.net — check your internet connection and reload.</p>';
    return;
  }
  if (typeof STOCK_DATA === 'undefined') {
    document.body.innerHTML = '<p style="padding:40px;color:#e2687e;font-family:monospace">Could not load data from https://jeffreytsaoprivate.github.io/stocks/SP500.js — check your internet connection and reload.</p>';
    return;
  }

  const SYMBOLS = STOCK_DATA.symbols; // ["^GSPC","QQQ","TQQQ"]
  const COLORS = { '^GSPC': '#5fb0e0', 'QQQ': '#e0a85f', 'TQQQ': '#e05f7e' };
  const LABELS = { '^GSPC': 'S&P500', 'QQQ': 'QQQ', 'TQQQ': 'TQQQ' };
  const disp = sym => LABELS[sym] || sym;
  const GRAD_OLD = '#3d4a63'; // muted slate = oldest point; fades toward each symbol's own color at the latest point

  // Row 2: each trailing-CAGR observation can belong to several of these
  // recency windows at once -- e.g. a window that ended 2 months ago counts
  // toward "Last 1y", "Last 3y", "Last 5y", "Last 10y" AND "All data". They
  // are deliberately overlapping/cumulative (each is a superset of the
  // shorter ones), unlike a mutually-exclusive bucketing scheme.
  const RECENCY_DEFS = [
    { key: '1y',  label: 'Last 1y',  color: '#4fd1a5', years: 1 },
    { key: '3y',  label: 'Last 3y',  color: '#5fb0e0', years: 3 },
    { key: '5y',  label: 'Last 5y',  color: '#e0a85f', years: 5 },
    { key: '10y', label: 'Last 10y', color: '#e05f7e', years: 10 },
    { key: 'all', label: 'All data', color: '#a78bfa', years: Infinity },
  ];

  // Parse dates once
  const series = {};
  SYMBOLS.forEach(sym => {
    series[sym] = STOCK_DATA.series[sym].map(p => ({
      ...p,
      d: new Date(p.date + 'T00:00:00Z'),
    }));
  });

  const allDates = SYMBOLS.flatMap(s => series[s].map(p => p.d.getTime()));
  const latestTime = Math.max(...allDates);
  const latestDate = new Date(latestTime);
  document.getElementById('asOf').textContent =
    'through ' + latestDate.toISOString().slice(0,10) + ' · generated ' + STOCK_DATA.generatedAt.slice(0,10);

  function cutoffFor(range) {
    if (range === 'all') return null;
    const years = { '10y': 10, '5y': 5, '3y': 3, '1y': 1 }[range];
    const d = new Date(latestDate.getTime());
    d.setFullYear(d.getFullYear() - years);
    return d;
  }

  function filtered(sym, range) {
    const cutoff = cutoffFor(range);
    if (!cutoff) return series[sym];
    return series[sym].filter(p => p.d >= cutoff);
  }

  // ---------- build static DOM shells ----------
  const priceRow = document.getElementById('priceRow');
  const distRow = document.getElementById('distRow');
  const scatterRow = document.getElementById('scatterRow');
  const tickerRow = document.getElementById('tickerRow');

  const priceCtx = {}, distCtx = {};
  SYMBOLS.forEach(sym => {
    const p1 = document.createElement('div');
    p1.className = 'panel';
    p1.innerHTML = `
      <div class="panel-head"><span class="sym" style="color:${COLORS[sym]}">${disp(sym)}</span><span class="sub" id="pxSub-${cssId(sym)}"></span></div>
      <div class="chart-wrap"><canvas id="priceChart-${cssId(sym)}"></canvas></div>`;
    priceRow.appendChild(p1);
    priceCtx[sym] = p1.querySelector('canvas').getContext('2d');

    const p2 = document.createElement('div');
    p2.className = 'panel';
    p2.innerHTML = `
      <div class="panel-head"><span class="sym" style="color:${COLORS[sym]}">${disp(sym)}</span><span class="sub" id="distSub-${cssId(sym)}"></span></div>
      <div class="chart-wrap"><canvas id="distChart-${cssId(sym)}"></canvas></div>
      <div class="legend-row">
        ${RECENCY_DEFS.map(r => `<span><i style="background:${r.color}"></i><span id="cat-${cssId(sym)}-${r.key}">${r.label}</span></span>`).join('')}
      </div>`;
    distRow.appendChild(p2);
    distCtx[sym] = p2.querySelector('canvas').getContext('2d');

    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="swatch" style="background:${COLORS[sym]}"></span>
      <span class="sym">${disp(sym)}</span>
      <span class="px mono" id="chipPx-${cssId(sym)}">--</span>
      <span class="chg mono" id="chipChg-${cssId(sym)}">--</span>`;
    tickerRow.appendChild(chip);
  });

  const scatterPairs = [['QQQ','^GSPC'], ['TQQQ','^GSPC']];
  const scatterCtx = {};
  scatterPairs.forEach(([y, x]) => {
    const key = y + '_' + x;
    const p = document.createElement('div');
    p.className = 'panel';
    p.innerHTML = `
      <div class="panel-head">
        <span class="sym"><span style="color:${COLORS[y]}">${disp(y)}</span> <span style="color:var(--text-dim)">vs</span> <span style="color:${COLORS[x]}">${disp(x)}</span></span>
        <span class="sub" id="fitEq-${cssId(key)}"></span>
      </div>
      <div class="chart-wrap tall"><canvas id="scatterChart-${cssId(key)}"></canvas></div>
      <div class="legend-row grad">
        <span><i style="background:${GRAD_OLD}"></i>oldest</span>
        <span><i style="background:${COLORS[y]}"></i>newest</span>
        <span><i style="background:#f2f4f8;border:2px solid ${COLORS[y]}"></i>selected date</span>
      </div>`;
    scatterRow.appendChild(p);
    scatterCtx[key] = p.querySelector('canvas').getContext('2d');
  });

  // Third row-3 panel: click a date on the S&P500 price chart to inspect that
  // week — highlights the matching point on both scatter charts above.
  const datePanel = document.createElement('div');
  datePanel.className = 'panel date-panel';
  datePanel.innerHTML = `
    <div class="panel-head">
      <span class="sym">Date explorer</span>
      <span class="sub" id="dateRangeSub"></span>
    </div>
    <div class="roll-toggle" id="rollGroup">
      <button type="button" class="roll-btn" data-months="3">3mo beta</button>
      <button type="button" class="roll-btn" data-months="6">6mo beta</button>
      <button type="button" class="roll-btn" data-months="12">1yr beta</button>
    </div>
    <div class="chart-wrap tall"><canvas id="dateChart"></canvas></div>
    <div class="legend-row">
      <span><i style="background:${COLORS['^GSPC']}"></i>S&P500 price (left axis)</span>
      <span><i style="background:${COLORS['QQQ']}"></i>QQQ/S&P500 beta</span>
      <span><i style="background:${COLORS['TQQQ']}"></i>TQQQ/S&P500 beta</span>
    </div>
    <div class="date-hint">Click the chart to inspect a week</div>
    <div class="date-current mono" id="dateCurrent">--</div>
    <div class="date-readout" id="dateReadout"></div>
    <div class="date-nudge">
      <button type="button" id="dateBack">&larr; prev week</button>
      <button type="button" id="dateFwd">next week &rarr;</button>
    </div>`;
  scatterRow.prepend(datePanel);
  const dateCtx = datePanel.querySelector('#dateChart').getContext('2d');

  function cssId(s){ return s.replace(/[^a-zA-Z0-9]/g,''); }

  // ---------- chart instances (rebuilt on range change) ----------
  let priceCharts = {}, distCharts = {}, scatterCharts = {};
  let dateChartInstance = null;
  let commonDates = [];   // dates present across all 3 symbols in the current range, ascending
  let scatterMeta = {};   // per scatter-pair lookup maps, used by the date explorer
  let selectedDate = null;
  let rollWindowMonths = 3;  // trailing window (months) for the rolling QQQ/TQQQ-vs-S&P500 beta traces
  let currentRange = 'all';
  let currentHorizonYears = 3;  // Row 2 time-horizon slider, independent of currentRange
  let distMode = 'normalized';  // Row 2 y-axis mode: 'normalized' (% of windows) or 'counts' (raw count)

  function subMonths(date, months){
    const d = new Date(date.getTime());
    d.setMonth(d.getMonth() - months);
    return d;
  }

  Chart.defaults.color = '#8996ab';
  Chart.defaults.borderColor = '#223047';
  Chart.defaults.font.family = "'IBM Plex Mono', monospace";
  Chart.defaults.font.size = 10.5;

  // Draws a full-height white line at x=0. Accepts either options.plugins.
  // zeroLine.value (a numeric position on a linear scale) or .index (a
  // category-scale tick index), so it redraws correctly wherever it's used,
  // and automatically lands in the right spot whenever a chart is rebuilt
  // (e.g. when the horizon slider changes).
  const zeroLinePlugin = {
    id: 'zeroLine',
    afterDatasetsDraw(chart, _args, opts){
      if (!opts) return;
      const xScale = chart.scales.x, yScale = chart.scales.y;
      if (!xScale || !yScale) return;
      let x;
      if (opts.value !== undefined && opts.value !== null) x = xScale.getPixelForValue(opts.value);
      else if (opts.index !== undefined && opts.index !== null && opts.index >= 0) x = xScale.getPixelForValue(opts.index);
      else return;
      const ctx = chart.ctx;
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, yScale.top);
      ctx.lineTo(x, yScale.bottom);
      ctx.stroke();
      ctx.restore();
    }
  };
  Chart.register(zeroLinePlugin);

  function destroyAll(map){ Object.values(map).forEach(c => c && c.destroy()); }

  function fmtPct(x){
    if (x === null || x === undefined || Number.isNaN(x)) return '--';
    return (x >= 0 ? '+' : '') + (x*100).toFixed(1) + '%';
  }

  // series indexed by date string for O(1) lookup, used by the date explorer
  const seriesByDate = {};
  SYMBOLS.forEach(sym => { seriesByDate[sym] = new Map(series[sym].map(p => [p.date, p])); });

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function lerpColor(hexA, hexB, t){
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(a[0] + (b[0]-a[0])*t);
    const g = Math.round(a[1] + (b[1]-a[1])*t);
    const bl = Math.round(a[2] + (b[2]-a[2])*t);
    return `rgb(${r},${g},${bl})`;
  }

  function buildHistogram(values, binCount, forceMin, forceMax){
    if (values.length === 0) return { bins: [], counts: [] };
    let min = forceMin !== undefined && forceMin !== null ? forceMin : Math.min(...values);
    let max = forceMax !== undefined && forceMax !== null ? forceMax : Math.max(...values);
    if (min === max) max = min + 1e-9;
    const width = (max - min) / binCount;
    const counts = new Array(binCount).fill(0);
    values.forEach(v => {
      let idx = Math.floor((v - min) / width);
      if (idx >= binCount) idx = binCount - 1;
      if (idx < 0) idx = 0;
      counts[idx]++;
    });
    const bins = counts.map((_, i) => min + width * (i + 0.5));
    return { bins, counts, min, max, width };
  }

  function linregress(points){
    // points: [{x,y}], ordinary least squares
    const n = points.length;
    if (n < 2) return null;
    let sx=0, sy=0, sxx=0, sxy=0, syy=0;
    points.forEach(p => { sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; syy+=p.y*p.y; });
    const denom = n*sxx - sx*sx;
    if (denom === 0) return null;
    const slope = (n*sxy - sx*sy) / denom;
    const intercept = (sy - slope*sx) / n;
    const yPred = points.map(p => slope*p.x + intercept);
    const yMean = sy / n;
    const ssRes = points.reduce((acc,p,i) => acc + Math.pow(p.y - yPred[i], 2), 0);
    const ssTot = points.reduce((acc,p) => acc + Math.pow(p.y - yMean, 2), 0);
    const r2 = ssTot === 0 ? 1 : 1 - ssRes/ssTot;
    return { slope, intercept, r2 };
  }

  // At every point in `paired` (ascending by date, with raw prices rawX/rawY),
  // compute weekly returns directly from raw price, then roll a trailing
  // `windowMonths` covariance(y,x)/variance(x) beta ending at each date.
  // Returns null until the window is fully covered by data (no extrapolating
  // the window backward beyond the first available return).
  //
  // Beta = Cov(returns_Y, returns_X) / Var(returns_X) — expanded via the
  // sum-of-products shortcut: (n·Σxy − Σx·Σy) / (n·Σx² − (Σx)²). Because the
  // window only ever slides forward (one point enters, at most one leaves per
  // step), Σx/Σy/Σx²/Σxy are maintained incrementally in O(1) per step —
  // add the entering point, subtract any point(s) that fall out of the
  // window — rather than re-summed over the whole window from scratch each
  // time. That makes the whole rolling series O(n) instead of O(n · window
  // size); at a 1-year (≈52-week) window that's roughly a 50x reduction in
  // the number of arithmetic operations.
  const MIN_ROLLING_POINTS = 3;
  function rollingBetaSeries(paired, windowMonths){
    const retX = [], retY = [], retDates = [], retDateStrs = [];
    for (let i = 1; i < paired.length; i++) {
      const x0 = paired[i-1].rawX, x1 = paired[i].rawX;
      const y0 = paired[i-1].rawY, y1 = paired[i].rawY;
      if (x0 && y0 !== undefined) {
        retX.push((x1 - x0) / x0);
        retY.push((y1 - y0) / y0);
        retDates.push(new Date(paired[i].date + 'T00:00:00Z'));
        retDateStrs.push(paired[i].date);
      }
    }
    const firstRetTime = retDates.length ? retDates[0].getTime() : null;
    const out = [];
    let start = 0;
    let n = 0, sumX = 0, sumY = 0, sumXX = 0, sumXY = 0; // running window sums
    for (let i = 0; i < retDates.length; i++) {
      sumX += retX[i]; sumY += retY[i]; sumXX += retX[i]*retX[i]; sumXY += retX[i]*retY[i]; n++;

      const windowStart = subMonths(retDates[i], windowMonths).getTime();
      while (start < i && retDates[start].getTime() < windowStart) {
        sumX -= retX[start]; sumY -= retY[start]; sumXX -= retX[start]*retX[start]; sumXY -= retX[start]*retY[start]; n--;
        start++;
      }

      // Only compute once the window's start boundary is at/after the series'
      // earliest return date — i.e. never extrapolate history we don't have.
      const fullyCovered = firstRetTime !== null && windowStart >= firstRetTime;
      let beta = null;
      if (fullyCovered && n >= MIN_ROLLING_POINTS) {
        const denom = n*sumXX - sumX*sumX;
        beta = denom !== 0 ? (n*sumXY - sumX*sumY) / denom : null;
      }
      out.push({ date: retDateStrs[i], beta });
    }
    return out;
  }

  function median(vals){
    if (!vals.length) return null;
    const s = [...vals].sort((a,b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  }

  // Round [min, max] outward to a "nice" step (1/2/5 x10^n) so axis bounds
  // land on round numbers instead of arbitrary padded values.
  function niceAxisBounds(min, max, targetTicks){
    if (!(max > min)) return { min: min - 1, max: max + 1, step: 1 };
    const rawStep = (max - min) / targetTicks;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    const niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    const step = niceNorm * mag;
    return { min: Math.floor(min / step) * step, max: Math.ceil(max / step) * step, step };
  }

  function render(range){
    currentRange = range;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));

    destroyAll(priceCharts); destroyAll(scatterCharts);
    priceCharts = {}; scatterCharts = {};
    if (dateChartInstance) { dateChartInstance.destroy(); dateChartInstance = null; }

    const dataByRange = {};
    SYMBOLS.forEach(sym => { dataByRange[sym] = filtered(sym, range); });

    // ---- Row 1: price lines ----
    // Per-panel Y-axis scaling: find each panel's own max/min price ratio,
    // take the largest ratio across the 3 panels (MaxRatio), then pad each
    // panel's axis so its own ratio scales toward MaxRatio:
    //   Ratio2 = (Max/Min) / MaxRatio
    //   axis = [ Min/sqrt(Ratio2), Max*sqrt(Ratio2) ]
    const priceStats = {};
    let maxRatio = 0;
    SYMBOLS.forEach(sym => {
      const prices = dataByRange[sym].map(p => p.price);
      const mn = prices.length ? Math.min(...prices) : 0;
      const mx = prices.length ? Math.max(...prices) : 1;
      const ratio = mn > 0 ? mx / mn : 1;
      priceStats[sym] = { min: mn, max: mx, ratio };
      if (ratio > maxRatio) maxRatio = ratio;
    });
    const priceYBounds = {};
    SYMBOLS.forEach(sym => {
      const { min: mn, max: mx, ratio } = priceStats[sym];
      const ratio2 = maxRatio > 0 ? ratio / maxRatio : 1;
      const factor = Math.sqrt(ratio2) || 1;
      let axisMin = mn / factor, axisMax = mx * factor;
      if (!(axisMax > axisMin)) { axisMin = mn; axisMax = mx; } // safety fallback, shouldn't trigger in practice
      priceYBounds[sym] = { min: axisMin, max: axisMax };
    });

    SYMBOLS.forEach(sym => {
      const pts = dataByRange[sym];
      const first = pts[0], last = pts[pts.length - 1];
      const rangeChg = first && last ? (last.price - first.price) / first.price : null;
      document.getElementById('pxSub-' + cssId(sym)).textContent =
        last ? last.price.toFixed(2) + ' (' + fmtPct(rangeChg) + ')' : '';

      document.getElementById('chipPx-' + cssId(sym)).textContent = last ? last.price.toFixed(2) : '--';
      const chgEl = document.getElementById('chipChg-' + cssId(sym));
      chgEl.textContent = fmtPct(rangeChg);
      chgEl.className = 'chg mono ' + (rangeChg >= 0 ? 'up' : 'down');

      priceCharts[sym] = new Chart(priceCtx[sym], {
        type: 'line',
        data: {
          labels: pts.map(p => p.date),
          datasets: [{
            data: pts.map(p => p.price),
            borderColor: COLORS[sym],
            backgroundColor: COLORS[sym] + '22',
            fill: true,
            pointRadius: 0,
            borderWidth: 1.6,
            tension: 0.05,
          }]
        },
        options: chartOptsBase({
          xTicks: 5,
          yTickCallback: v => v.toFixed(0),
          tooltipLabel: ctx => LABELS[sym] + ': ' + ctx.parsed.y.toFixed(2),
          yMin: priceYBounds[sym].min,
          yMax: priceYBounds[sym].max,
        })
      });
    });

    // ---- Row 3: scatter + best fit (normalized to latest price, colored by date) ----
    scatterPairs.forEach(([ySym, xSym]) => {
      const key = ySym + '_' + xSym;
      const xSeries = dataByRange[xSym];
      const ySeries = dataByRange[ySym];
      const xLatest = xSeries[xSeries.length - 1]?.price;
      const yLatest = ySeries[ySeries.length - 1]?.price;
      const xByDate = new Map(xSeries.map(p => [p.date, p.price]));
      const yByDate = new Map(ySeries.map(p => [p.date, p.price]));

      const rawPaired = ySeries.filter(p => xByDate.has(p.date) && xLatest && yLatest);
      const n = rawPaired.length;
      const paired = rawPaired.map((p, i) => {
        const rawX = xByDate.get(p.date);
        const t = n > 1 ? i / (n - 1) : 1; // 0 = oldest date in range, 1 = newest
        return {
          x: rawX / xLatest,
          y: p.price / yLatest,
          rawX,
          rawY: p.price,
          date: p.date,
          _color: lerpColor(GRAD_OLD, COLORS[ySym], t),
        };
      });

      scatterMeta[key] = { xByDate, yByDate, xLatest, yLatest, xSym, ySym, paired };

      const fit = linregress(paired);
      let fitLine = [];
      if (fit && paired.length) {
        const xs = paired.map(p => p.x);
        const xMin = Math.min(...xs), xMax = Math.max(...xs);
        fitLine = [{ x: xMin, y: fit.slope*xMin + fit.intercept }, { x: xMax, y: fit.slope*xMax + fit.intercept }];
      }

      // Give x and y the same extent (min/max), with a little padding, so both
      // axes are directly comparable and a 45-degree line means "equal move".
      let axisMin = 0, axisMax = 1;
      if (paired.length) {
        const allVals = paired.flatMap(p => [p.x, p.y]);
        const rawMin = Math.min(...allVals), rawMax = Math.max(...allVals);
        const pad = (rawMax - rawMin) * 0.05 || 0.05;
        axisMin = rawMin - pad;
        axisMax = rawMax + pad;
      }

      const eqEl = document.getElementById('fitEq-' + cssId(key));
      eqEl.textContent = fit
        ? `y = ${fit.slope.toFixed(3)}x ${fit.intercept >= 0 ? '+' : '-'} ${Math.abs(fit.intercept).toFixed(2)}  ·  R\u00B2=${fit.r2.toFixed(3)}`
        : 'insufficient data';

      scatterCharts[key] = new Chart(scatterCtx[key], {
        type: 'scatter',
        data: {
          datasets: [
            {
              label: LABELS[ySym] + ' vs ' + LABELS[xSym],
              data: paired,
              backgroundColor: paired.map(p => p._color),
              borderColor: paired.map(p => p._color),
              pointRadius: 2.5,
              pointHoverRadius: 5,
            },
            {
              label: 'best fit',
              type: 'line',
              data: fitLine,
              borderColor: '#e7ebf2',
              borderWidth: 1.5,
              borderDash: [5,3],
              pointRadius: 0,
              fill: false,
            },
            {
              // highlight for whatever date is picked in the date-explorer panel
              label: 'selected date',
              data: [],
              backgroundColor: '#f2f4f8',
              borderColor: COLORS[ySym],
              borderWidth: 2,
              pointRadius: 6,
              pointHoverRadius: 7,
              pointStyle: 'circle',
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              filter: item => item.datasetIndex === 0 || item.datasetIndex === 2,
              callbacks: {
                title: items => items[0]?.raw?.date || '',
                label: ctx => `${disp(xSym)}: $${ctx.raw.rawX.toFixed(2)}   ${disp(ySym)}: $${ctx.raw.rawY.toFixed(2)}`,
              }
            }
          },
          scales: {
            x: { min: axisMin, max: axisMax, title: { display: true, text: disp(xSym) + ' price \u00f7 latest', color:'#8996ab' }, grid: { color:'#1c2534' } },
            y: { min: axisMin, max: axisMax, title: { display: true, text: disp(ySym) + ' price \u00f7 latest', color:'#8996ab' }, grid: { color:'#1c2534' } },
          }
        }
      });
    });

    // ---- Date explorer setup: S&P500 price chart, click to pick a week ----
    const dateSets = SYMBOLS.map(sym => new Set(dataByRange[sym].map(p => p.date)));
    commonDates = dateSets.length
      ? [...dateSets[0]].filter(d => dateSets.every(s => s.has(d))).sort()
      : [];
    document.getElementById('dateRangeSub').textContent = commonDates.length
      ? commonDates[0] + ' \u2192 ' + commonDates[commonDates.length - 1]
      : '';
    document.querySelectorAll('.roll-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.months) === rollWindowMonths));

    const gspcPts = dataByRange['^GSPC'];
    const gspcLabels = gspcPts.map(p => p.date);
    const gspcPrices = gspcPts.map(p => p.price);

    // Rolling trailing-window beta = Cov(returns_symbol, returns_S&P500) / Var(returns_S&P500),
    // reusing the same normalized series already built for the row-3 scatter panels
    // (normalization is a per-series constant, so it doesn't affect returns/beta).
    function betaDataset(pairKey){
      const meta = scatterMeta[pairKey];
      const byBetaDate = new Map();
      if (meta) rollingBetaSeries(meta.paired, rollWindowMonths).forEach(pt => byBetaDate.set(pt.date, pt.beta));
      return gspcLabels.map(d => byBetaDate.has(d) ? byBetaDate.get(d) : null);
    }
    const qqqBeta = betaDataset('QQQ_^GSPC');
    const tqqqBeta = betaDataset('TQQQ_^GSPC');

    dateChartInstance = new Chart(dateCtx, {
      type: 'line',
      data: {
        labels: gspcLabels,
        datasets: [
          {
            label: 'S&P500 price',
            yAxisID: 'yPrice',
            data: gspcPrices,
            borderColor: COLORS['^GSPC'],
            backgroundColor: COLORS['^GSPC'] + '22',
            fill: true,
            borderWidth: 1.6,
            tension: 0.05,
            pointRadius: gspcPrices.map(() => 0),
            pointHoverRadius: 3,
            pointBackgroundColor: gspcPrices.map(() => COLORS['^GSPC']),
            pointBorderColor: gspcPrices.map(() => COLORS['^GSPC']),
            pointBorderWidth: 2,
          },
          {
            label: 'QQQ/S&P500 beta',
            yAxisID: 'yBeta',
            data: qqqBeta,
            borderColor: COLORS['QQQ'],
            backgroundColor: 'transparent',
            borderWidth: 1.4,
            pointRadius: 0,
            tension: 0.15,
            spanGaps: false,
          },
          {
            label: 'TQQQ/S&P500 beta',
            yAxisID: 'yBeta',
            data: tqqqBeta,
            borderColor: COLORS['TQQQ'],
            backgroundColor: 'transparent',
            borderWidth: 1.4,
            tension: 0.15,
            pointRadius: 0,
            spanGaps: false,
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        onClick: (evt, _els, chart) => {
          const hits = chart.getElementsAtEventForMode(evt, 'index', { intersect: false }, true);
          if (hits.length) selectDate(chart.data.labels[hits[0].index]);
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            filter: item => item.raw !== null && item.raw !== undefined,
            callbacks: {
              title: items => items[0]?.label || '',
              label: ctx => ctx.datasetIndex === 0
                ? disp('^GSPC') + ': $' + ctx.parsed.y.toFixed(2)
                : ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2),
            }
          }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 5, color:'#8996ab' }, grid: { color:'#1c2534' } },
          yPrice: {
            position: 'left',
            ticks: { color:'#8996ab' },
            grid: { color:'#1c2534' },
            title: { display: true, text: 'S&P500 price', color:'#8996ab' },
          },
          yBeta: {
            position: 'right',
            ticks: { color:'#8996ab' },
            grid: { drawOnChartArea: false },
            title: { display: true, text: 'rolling beta', color:'#8996ab' },
          },
        }
      }
    });

    selectDateByIndex(commonDates.length - 1); // default to the latest date in range
  }

  // ---- Row 2: annualized return distribution, stacked by recency ----
  // Independent of the top-of-page range buttons: always uses each symbol's
  // full history, because the whole point is to show how counts split
  // across "last 1y / 1-3y / 3-5y / 5-10y / 10y+" -- restricting to a short
  // range would empty out most of those buckets.
  const MS_PER_YEAR = 365.25 * 24 * 3600 * 1000;
  const NEAREST_TOL_MS = 5 * 24 * 3600 * 1000; // ~half a week, since data is weekly

  // Nearest data point to targetTime for `sym` (binary search; series[sym]
  // is ascending by date). Returns null if nothing is within tolerance,
  // e.g. when there isn't enough history to look back `horizonYears`.
  function nearestSeriesPoint(sym, targetTime){
    const arr = series[sym];
    if (!arr.length) return null;
    const lastT = arr[arr.length - 1].d.getTime();
    if (targetTime <= arr[0].d.getTime()) {
      return Math.abs(arr[0].d.getTime() - targetTime) <= NEAREST_TOL_MS ? arr[0] : null;
    }
    if (targetTime >= lastT) {
      return Math.abs(lastT - targetTime) <= NEAREST_TOL_MS ? arr[arr.length - 1] : null;
    }
    let lo = 0, hi = arr.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid].d.getTime() < targetTime) lo = mid + 1; else hi = mid;
    }
    const candB = arr[lo], candA = arr[lo - 1];
    let best = candB;
    if (candA && Math.abs(candA.d.getTime() - targetTime) < Math.abs(candB.d.getTime() - targetTime)) best = candA;
    return Math.abs(best.d.getTime() - targetTime) <= NEAREST_TOL_MS ? best : null;
  }

  // Trailing CAGR ending at every date in symbol's full history, computed
  // directly from raw prices so any integer horizon 1-10y works (not just
  // the 1/3/5/10y windows the data happens to precompute).
  function trailingCAGR(sym, horizonYears){
    const arr = series[sym];
    const out = [];
    arr.forEach(p => {
      const targetDate = new Date(p.d.getTime());
      targetDate.setFullYear(targetDate.getFullYear() - horizonYears);
      const past = nearestSeriesPoint(sym, targetDate.getTime());
      if (!past || !(past.price > 0)) return;
      const totalReturn = (p.price - past.price) / past.price;
      if (totalReturn <= -1) return;
      const cagr = Math.pow(1 + totalReturn, 1 / horizonYears) - 1;
      out.push({ date: p.date, d: p.d, cagr });
    });
    return out;
  }

  function renderRow2(horizonYears){
    destroyAll(distCharts);
    distCharts = {};

    document.getElementById('horizonVal').textContent = horizonYears + 'y';
    const sub = document.getElementById('row2Sub');
    if (sub) sub.textContent = 'Trailing ' + horizonYears + 'y CAGR';

    const perSym = {};
    let cagrMin = Infinity, cagrMax = -Infinity;
    SYMBOLS.forEach(sym => {
      const pts = trailingCAGR(sym, horizonYears);
      perSym[sym] = pts;
      pts.forEach(p => { if (p.cagr < cagrMin) cagrMin = p.cagr; if (p.cagr > cagrMax) cagrMax = p.cagr; });
    });
    if (!(cagrMin <= cagrMax)) { cagrMin = -0.1; cagrMax = 0.1; }

    // Pick a "nice" bin width, then force bin CENTERS onto multiples of it
    // (k = round(value/w), center = k*w, edges = center +/- w/2). That
    // guarantees k=0 is its own bin spanning [-w/2, +w/2) -- one interval
    // symmetric around 0 -- and every value lands in exactly one bin.
    const stepCandidates = [0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50];
    const rawStep = ((cagrMax - cagrMin) * 100) / 30 || 1;
    const w = stepCandidates.find(c => c >= rawStep) || stepCandidates[stepCandidates.length - 1];

    let kMin = Math.floor((cagrMin * 100) / w - 0.5);
    let kMax = Math.ceil((cagrMax * 100) / w + 0.5);
    kMin = Math.min(kMin, 0);
    kMax = Math.max(kMax, 0);
    const ks = [];
    for (let k = kMin; k <= kMax; k++) ks.push(k);

    // Tick spacing for axis labels, independent of the (finer) bin width.
    const spanK = kMax - kMin || 1;
    const tickStepK = Math.max(1, Math.round(spanK / 8));

    SYMBOLS.forEach(sym => {
      const pts = perSym[sym];
      const subEl = document.getElementById('distSub-' + cssId(sym));
      if (subEl) subEl.textContent = pts.length + ' trailing ' + horizonYears + 'y windows';

      const datasets = RECENCY_DEFS.map(def => {
        const subset = pts.filter(p => {
          const diffYears = (latestDate.getTime() - p.d.getTime()) / MS_PER_YEAR;
          return diffYears <= def.years;
        });
        const total = subset.length;
        const counts = new Array(ks.length).fill(0);
        subset.forEach(p => {
          let k = Math.round((p.cagr * 100) / w);
          if (k < kMin) k = kMin;
          if (k > kMax) k = kMax;
          counts[k - kMin]++;
        });

        // Normalized so heights sum to 1 (100%) per category -- each
        // overlapping area's total "mass" is the same, regardless of how
        // many windows fall in that recency slice.
        const med = median(subset.map(p => p.cagr));
        const legendEl = document.getElementById('cat-' + cssId(sym) + '-' + def.key);
        if (legendEl) legendEl.textContent = def.label + (med === null ? '' : ' ' + fmtPct(med));

        return {
          label: def.label,
          data: ks.map((k, i) => ({ x: k * w, y: distMode === 'counts' ? counts[i] : (total ? counts[i] / total : 0) })),
          backgroundColor: def.color + '30',
          borderColor: def.color,
          borderWidth: 1.6,
          pointRadius: 0,
          tension: 0.35,
          fill: true, // each area fills to the x-axis independently (overlapping, non-stacked)
          _n: total,
        };
      });

      distCharts[sym] = new Chart(distCtx[sym], {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: {
            legend: { display: false },
            zeroLine: { value: 0 },
            tooltip: {
              callbacks: {
                title: items => items.length ? (items[0].raw.x).toFixed(1) + '% CAGR' : '',
                label: ctx => distMode === 'counts'
                  ? ctx.dataset.label + ': ' + ctx.raw.y + ' window' + (ctx.raw.y === 1 ? '' : 's')
                  : ctx.dataset.label + ': ' + (ctx.raw.y * 100).toFixed(1) + '% of windows',
              }
            }
          },
          scales: {
            x: {
              type: 'linear', min: kMin * w, max: kMax * w,
              title: { display: true, text: 'CAGR (%)', color:'#8996ab' },
              ticks: { stepSize: tickStepK * w, color:'#8996ab' },
              grid: { color:'#1c2534' },
            },
            y: {
              stacked: false,
              title: { display: true, text: distMode === 'counts' ? 'count' : 'probability', color:'#8996ab' },
              grid: { color:'#1c2534' },
              beginAtZero: true,
              ticks: {
                callback: v => distMode === 'counts' ? v : (v * 100).toFixed(0) + '%',
                color:'#8996ab',
                precision: distMode === 'counts' ? 0 : undefined,
              },
            },
          }
        }
      });
    });
  }

  function selectDateByIndex(idx){
    if (!commonDates.length) return;
    idx = Math.max(0, Math.min(commonDates.length - 1, idx));
    applySelection(commonDates[idx]);
  }

  // Snap a clicked date to the nearest date common to all 3 symbols in the current range.
  function selectDate(dateStr){
    if (!commonDates.length) return;
    let nearest = commonDates[0], best = Infinity;
    const t = new Date(dateStr + 'T00:00:00Z').getTime();
    for (const d of commonDates) {
      const diff = Math.abs(new Date(d + 'T00:00:00Z').getTime() - t);
      if (diff < best) { best = diff; nearest = d; }
    }
    applySelection(nearest);
  }

  function applySelection(dateStr){
    if (!dateStr) {
      document.getElementById('dateCurrent').textContent = '--';
      document.getElementById('dateReadout').innerHTML = '';
      return;
    }
    selectedDate = dateStr;
    document.getElementById('dateCurrent').textContent = dateStr;

    document.getElementById('dateReadout').innerHTML = SYMBOLS.map(sym => {
      const pt = seriesByDate[sym].get(dateStr);
      return `<div class="date-readout-row">
        <span class="lbl"><i style="background:${COLORS[sym]}"></i>${disp(sym)}</span>
        <span class="val">${pt ? '$' + pt.price.toFixed(2) : '--'}</span>
      </div>`;
    }).join('');

    Object.entries(scatterMeta).forEach(([key, meta]) => {
      const chart = scatterCharts[key];
      if (!chart) return;
      const rawX = meta.xByDate.get(dateStr);
      const rawY = meta.yByDate.get(dateStr);
      chart.data.datasets[2].data = (rawX !== undefined && rawY !== undefined && meta.xLatest && meta.yLatest)
        ? [{ x: rawX / meta.xLatest, y: rawY / meta.yLatest, rawX, rawY, date: dateStr }]
        : [];
      chart.update('none');
    });

    if (dateChartInstance) {
      const labels = dateChartInstance.data.labels;
      const idx = labels.indexOf(dateStr);
      const n = labels.length;
      const radii = new Array(n).fill(0);
      const bg = new Array(n).fill(COLORS['^GSPC']);
      if (idx >= 0) { radii[idx] = 6; bg[idx] = '#f2f4f8'; }
      dateChartInstance.data.datasets[0].pointRadius = radii;
      dateChartInstance.data.datasets[0].pointBackgroundColor = bg;
      dateChartInstance.update('none');
    }
  }

  function chartOptsBase({ xTicks, yTickCallback, tooltipLabel, yMin, yMax }){
    return {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: tooltipLabel } },
      },
      scales: {
        x: { ticks: { maxTicksLimit: xTicks, color:'#8996ab' }, grid: { color:'#1c2534' } },
        y: { min: yMin, max: yMax, ticks: { callback: yTickCallback, color:'#8996ab' }, grid: { color:'#1c2534' } },
      }
    };
  }

  document.getElementById('rangeGroup').addEventListener('click', e => {
    const btn = e.target.closest('.range-btn');
    if (!btn) return;
    render(btn.dataset.range);
  });

  document.getElementById('rollGroup').addEventListener('click', e => {
    const btn = e.target.closest('.roll-btn');
    if (!btn) return;
    rollWindowMonths = Number(btn.dataset.months);
    render(currentRange); // rebuild with the new rolling window, same date range
  });

  document.getElementById('dateBack').addEventListener('click', () => {
    const idx = commonDates.indexOf(selectedDate);
    selectDateByIndex((idx === -1 ? commonDates.length - 1 : idx) - 1);
  });
  document.getElementById('dateFwd').addEventListener('click', () => {
    const idx = commonDates.indexOf(selectedDate);
    selectDateByIndex((idx === -1 ? commonDates.length - 1 : idx) + 1);
  });

  document.getElementById('horizonSlider').addEventListener('input', e => {
    currentHorizonYears = Number(e.target.value);
    renderRow2(currentHorizonYears);
  });

  document.getElementById('distModeGroup').addEventListener('click', e => {
    const btn = e.target.closest('.roll-btn');
    if (!btn) return;
    distMode = btn.dataset.mode;
    document.querySelectorAll('#distModeGroup .roll-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === distMode));
    renderRow2(currentHorizonYears);
  });

  render('all');
  renderRow2(currentHorizonYears);
}

if (typeof STOCK_DATA === 'undefined') {
  loadScript('https://jeffreytsaoprivate.github.io/stocks/SP500.js', main);
} else {
  main();
}

</script>
</html>
