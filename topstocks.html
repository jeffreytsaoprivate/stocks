<!DOCTYPE html>
<head><meta http-equiv='Content-Type' content='text/html; charset=UTF-8'>

<title>Top stocks</title>
<style>
:root {
  --bg: #f4f6fb;
  --card-bg: #ffffff;
  --border: #e3e7ef;
  --text: #1a2233;
  --text-muted: #6b7280;
  --accent: #2f5aff;
  --accent-soft: #eef2ff;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.06);
  --radius: 14px;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
}

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}

/* ---------- Header ---------- */
.app-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  padding: 0 4px;
}
.app-header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.info-btn {
  background: none;
  border: none;
  padding: 0;
  font-size: 18px;
  color: var(--text-muted);
  cursor: pointer;
  line-height: 1;
}
.info-btn:hover {
  color: var(--accent);
}
.timestamp {
  font-size: 13px;
  color: var(--text-muted);
}

/* ---------- Layout cards ---------- */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 20px;
  align-items: start;
  margin-bottom: 20px;
}
.chart-card {
  padding: 16px;
  overflow-x: auto;
}
.chart-card, .filters-card, .table-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.filters-card {
  padding: 18px 16px;
}
.filter-group + .filter-group {
  margin-top: 22px;
}
.filter-group h2 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin: 0 0 10px 0;
}
.table-card {
  padding: 4px;
  overflow-x: auto;
}

#chart {
  width: 800px;
  height: 600px;
  margin: 0 auto;
}

/* ---------- Zoom controls ---------- */
.chart-layout {
  display: grid;
  grid-template-columns: 40px 800px;
  grid-template-rows: 600px 40px;
  column-gap: 6px;
  row-gap: 6px;
  width: max-content;
  margin: 0 auto;
}
.zoom-y-wrap {
  grid-column: 1;
  grid-row: 1;
  width: 40px;
  height: 600px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.zoom-y-wrap input[type='range'] {
  writing-mode: vertical-lr;
  direction: rtl;
  -webkit-appearance: slider-vertical;
  width: 20px;
  height: 520px;
  margin: 0;
  accent-color: var(--accent);
}
.zoom-y-wrap .zoom-value {
  font-size: 11px;
  color: var(--text-muted);
}
.chart-anchor {
  grid-column: 2;
  grid-row: 1;
}
.zoom-x-wrap {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 800px;
}
.zoom-x-wrap input[type='range'] {
  flex: 1;
  accent-color: var(--accent);
}
.zoom-x-wrap .zoom-value {
  font-size: 11px;
  color: var(--text-muted);
  min-width: 32px;
  text-align: right;
}

/* ---------- Tooltip ---------- */
#tooltip {
  position: absolute;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  opacity: 0.0;
  transition: opacity 0.15s ease;
  box-shadow: 0 8px 24px rgba(16, 24, 40, 0.14);
  font-size: 13px;
  max-width: 320px;
  z-index: 50;
  pointer-events: auto;
}
.tooltip {
  border-collapse: collapse;
  width: 100%;
}
.tooltip th, .tooltip td {
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 5px 4px;
  text-align: left;
}
.tooltip tr:last-child th,
.tooltip tr:last-child td {
  border-bottom: none;
}

/* ---------- Data table ---------- */
.datatable {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
.datatable th, .datatable td {
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  text-align: left;
}
.datatable th {
  background-color: var(--accent-soft);
  color: #1e2a55;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
}
.datatable tbody tr:nth-child(even) {
  background-color: #fafbfd;
}
.datatable tr:hover {
  background-color: #eef2ff;
}
.datatable td {
  cursor: pointer;
}
.datatable th a {
  font-size: 11px;
}
#filterName {
  font-size: 13px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-weight: normal;
  text-transform: none;
  letter-spacing: normal;
}
#filterNameCancel {
  font-size: 12px;
  padding: 4px 8px;
  margin-left: 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  color: var(--text-muted);
}
#filterNameCancel:hover {
  background: #f3f4f6;
  color: var(--text);
}

.hidden {
  display: none;
}
a:hover {color: var(--accent);}
a { color: var(--text-muted); text-decoration: none;}

/* ---------- Category / filter buttons ---------- */
.category-container-class {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.category-container-class input[type='radio'] {
  display: none;
}
.category-button {
  display: block;
  padding: 6px 12px;
  border: 1px solid transparent;
  cursor: pointer;
  border-radius: 8px;
  width: 100%;
  font-size: 13px;
  font-weight: 500;
  opacity: 0.6;
  margin-top: 0;
  transition: opacity 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}
.category-button:hover {
  opacity: 0.9;
  transform: translateX(1px);
}
.category-button.checked {
  border: 1px solid rgba(0,0,0,0.35);
  font-weight: 700;
  opacity: 1;
  box-shadow: 0 0 0 2px rgba(47, 90, 255, 0.18), inset 0 0 0 1px rgba(255,255,255,0.4);
}

/* ---------- Responsive ---------- */
@media (max-width: 880px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
  .filters-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .filter-group + .filter-group {
    margin-top: 0;
  }
}
</style>
</head>

<body>
  <div class="page">
    <header class="app-header">
      <h1>Top stocks <button type="button" class="info-btn" onclick="showHelpInfo(event)" onmouseover="showHelpInfo(event)" aria-label="About this analysis">&#9432;</button></h1>
      <div id="updatetimestamp" class="timestamp"></div>
    </header>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-layout">
          <div class="zoom-y-wrap" title="Zoom Y (drop)">
            <input type="range" id="zoomYSlider" min="0" max="100" value="0" step="1">
            <span class="zoom-value" id="zoomYValue">0%</span>
          </div>
          <div class="chart-anchor" id="chart"></div>
          <div class="zoom-x-wrap" title="Zoom X (growth)">
            <input type="range" id="zoomXSlider" min="0" max="100" value="0" step="1">
            <span class="zoom-value" id="zoomXValue">0%</span>
          </div>
        </div>
      </div>
      <aside class="filters-card">
        <div class="filter-group">
          <h2>Sector</h2>
          <div id="category-container" class="category-container-class"></div>
        </div>
        <div class="filter-group">
          <h2>Prediction error</h2>
          <div id="prederr-container" class="category-container-class"></div>
        </div>
      </aside>
    </div>

    <div class="table-card">
      <div id="table-container"></div>
    </div>
  </div>

  <div id="tooltip"></div>

<script src='https://d3js.org/d3.v7.min.js'></script>
<script src='https://jeffreytsaoprivate.github.io/stocks/topstocks.js'></script>
<script>
//------------------------------------------------
// Global variables
let highlightItem = null;
let filterItem = '';
let lo_opacity = 0.05;
let mid_opacity = 0.2;
let showCategory = 'Show all';
let showPredErr = 'Show All';
let svg;

function loadScript(src, forcereload = true) {
  const script = document.createElement('script');
  script.type = "text/javascript";  
  if (forcereload) {
     script.src = src + "?v=" + (Math.floor(Math.random() * (1000000 - 1 + 1)) + 1);
  } else {
     script.src = src;
  }
  document.head.appendChild(script);
}
//loadScript("https://jeffreytsaoprivate.github.io/stocks/topstocks.js");

data.forEach(d => {
  if (d.sector.startsWith('Basic Materials') || d.sector.endsWith('Basic Materials')) {
    d.color = '#FFECD1';
  } else if (d.sector.startsWith('Communication Services') || d.sector.endsWith('Communication Services')) {
    d.color = '#F00000';
  } else if (d.sector.startsWith('Consumer Cyclical') || d.sector.endsWith('Consumer Cyclical')) {
    d.color = '#0080FF';
  } else if (d.sector.startsWith('Consumer Defensive') || d.sector.endsWith('Consumer Defensive')) {
    d.color = '#80FF00';
  } else if (d.sector.startsWith('Energy') || d.sector.endsWith('Energy')) {
    d.color = '#C0C000';
  } else if (d.sector.startsWith('Financial Services') || d.sector.endsWith('Financial Services')) {
    d.color = '#00FF00';
  } else if (d.sector.startsWith('Healthcare') || d.sector.endsWith('Healthcare')) {
    d.color = '#008000';
  } else if (d.sector.startsWith('Industrials') || d.sector.endsWith('Industrials')) {
    d.color = '#C0C0C0';
  } else if (d.sector.startsWith('Real Estate') || d.sector.endsWith('Real Estate')) {
    d.color = '#800080';
  } else if (d.sector.startsWith('Technology') || d.sector.endsWith('Technology')) {
    d.color = '#0000FF';
  } else if (d.sector.startsWith('Utilities') || d.sector.endsWith('Utilities')) {
    d.color = '#808080';
  } else {
    d.color = '#000000';
  }
  d.outlinecolor = '#000000';
  d.opacity = 1;
  var dateStrings = d.date;
  d.datevalue = dateStrings.map(dateString => new Date(dateString));
});

if (typeof updatetimestamp !== 'undefined') {
  d3.select('#updatetimestamp').html(updatetimestamp);
}

const width = 800;
const height = 600;
svg = d3.select('#chart').append('svg').attr('width', width).attr('height', height);
svg.append('defs').append('clipPath').attr('id', 'plot-clip')
  .append('rect').attr('x', 100).attr('y', 50).attr('width', width - 200).attr('height', height - 100);
const chartRoot = svg.append('g');
svg.on('click', clickChart);

//------------------------------------------------
// Zoom state (interactive zoom into the upper-left corner of the bubble chart)
const MaxAnnualGrowthFold = 5;
const fullXMax = d3.max(data, d => Math.min(d.change, MaxAnnualGrowthFold * 100));
const fullYMin = d3.min(data, d => d.drop);
const minXMax = fullXMax * 0.05;   // most-zoomed-in X domain (upper-left = small growth values)
const minYMin = fullYMin * 0.05;   // most-zoomed-in Y domain (upper-left = small drop magnitude)
let currentXMax = fullXMax;
let currentYMin = fullYMin;

let zoomRedrawScheduled = false;
function setZoomFromSliders() {
  const xPct = parseInt(document.getElementById('zoomXSlider').value, 10);
  const yPct = parseInt(document.getElementById('zoomYSlider').value, 10);
  currentXMax = fullXMax - (xPct / 100) * (fullXMax - minXMax);
  currentYMin = fullYMin + (yPct / 100) * (minYMin - fullYMin);
  document.getElementById('zoomXValue').textContent = xPct + '%';
  document.getElementById('zoomYValue').textContent = yPct + '%';
  if (!zoomRedrawScheduled) {
    zoomRedrawScheduled = true;
    requestAnimationFrame(() => {
      zoomRedrawScheduled = false;
      updateBubbleChart();
    });
  }
}
document.getElementById('zoomXSlider').addEventListener('input', setZoomFromSliders);
document.getElementById('zoomYSlider').addEventListener('input', setZoomFromSliders);
const viewcategories = ['Show all', 'Basic Materials', 'Communication Services', 'Consumer Cyclical', 'Consumer Defensive', 'Energy', 'Financial Services', 'Healthcare', 'Industrials', 'Real Estate', 'Technology', 'Utilities', 'Others'];
const knownSectors = viewcategories.filter(c => c !== 'Show all' && c !== 'Others');
function sectorMatches(d, category) {
  if (category === 'Show all' || category === 'Show All') return true;
  if (category === 'Others') {
    return !knownSectors.some(s => d.sector.startsWith(s) || d.sector.endsWith(s));
  }
  return d.sector.startsWith(category);
}
const categorycolors = ['#ffffff', '#FFECD1', '#F00000', '#0080FF', '#80FF00', '#C0C000', '#00FF00', '#008000', '#C0C0C0', '#800080', '#0000FF', '#808080', '#000000'];
const categoryfontcolors = ['#000', '#000', '#fff', '#fff', '#000', '#fff', '#000', '#fff', '#000', '#fff', '#fff', '#fff', '#fff'];

function createCategoryButtons(container, options, optioncolors, optionfontcolors, groupName = 'option') {
  options.forEach((option, index) => {
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = groupName;
    input.value = option;
    input.checked = (index == 0);
    input.id = `${groupName}-${index}`;
    const label = document.createElement('label');
    label.htmlFor = `${groupName}-${index}`;
    label.innerHTML = option;
    label.value = option;
    label.style.color = optionfontcolors[index];
    label.style.backgroundColor = optioncolors[index];
    label.classList.add('category-button');
    if (index == 0) label.classList.add('checked');
    container.appendChild(input);
    container.appendChild(label);
  });
  const categoryButtons = container.querySelectorAll('.category-button');
  categoryButtons.forEach(button => {
    button.addEventListener('click', () => {
      categoryButtons.forEach(btn => btn.classList.remove('checked'));
      button.classList.add('checked');
    });
  });
}

function changeCategory() {
  const button = document.querySelector('input[name=\'sector-option\']:checked');
  const selectedOption = button.value;
  if (showCategory == selectedOption) {
    showCategory = 'Show all';
    const categoryButtons = document.querySelectorAll('.category-button');
    categoryButtons.forEach(button => {
      button.classList.remove('checked');
      if (button.value == 'Show all') button.classList.add('checked');
    });
  } else {
    showCategory = selectedOption;
  }
  highlightItem = null;
  hideTooltip();
  updateOpacity();
  updateGraphics();
  sortTable('datatable', 0, true);
}
function changePredErr() {
  const button = document.querySelector("input[name='prederr-option']:checked");
  const selectedOption = button.value;
  if (showPredErr === selectedOption) {
    showPredErr = 'Show All';
    const buttons = document.querySelectorAll('#prederr-container .category-button');
    buttons.forEach(b => { b.classList.remove('checked'); if (b.value === 'Show All') b.classList.add('checked'); });
  } else {
    showPredErr = selectedOption;
  }
  highlightItem = null;
  hideTooltip();
  updateOpacity();
  updateGraphics();
  sortTable('datatable', 0, true);
}
function updateOpacity_OLD() {
  if (highlightItem == null) {
    if (showCategory == 'Show all') {
      data.forEach(d => {
        d.opacity = 1;
      });
    } else {
      data.forEach(d => {
        d.opacity = (d.sector.startsWith(showCategory) ? 1 : lo_opacity);
      });
    }
  } else {
    if (showCategory == 'Show all') {
      data.forEach(d => {
        d.opacity = (d.symbol == highlightItem ? 1 : lo_opacity);
      });
    } else {
      data.forEach(d => {
        d.opacity = (d.symbol == highlightItem ? 1 : (d.sector.startsWith(showCategory) ? mid_opacity : lo_opacity));
      });
    }
  }
}
function updateOpacity() {
  // parse PredErr threshold
  let PredErrThreshold = null;
  if (showPredErr && showPredErr !== 'Show All') {
    PredErrThreshold = parseInt(showPredErr.replace('% or less',''), 10); // 95 from "95%+"
  }
  function matchesSector(d) {
    return sectorMatches(d, showCategory);
  }
  function matchesPredErr(d) {
    return PredErrThreshold === null ? true : ( (d.AllPredErr[0] || 0) <= PredErrThreshold );
  }

  if (highlightItem == null) {
    data.forEach(d => {
      d.opacity = (matchesSector(d) && matchesPredErr(d)) ? 1 : lo_opacity;
    });
    if ((showCategory === 'Show all' || showCategory === 'Show All') && PredErrThreshold === null) {
      data.forEach(d => d.opacity = 1); // both filters are "show all"
    }
  } else {
    data.forEach(d => {
      const isMatch = matchesSector(d) && matchesPredErr(d);
      if (d.symbol == highlightItem) {
        d.opacity = 1;
      } else {
        d.opacity = isMatch ? mid_opacity : lo_opacity;
      }
    });
  }
}
createCategoryButtons(document.getElementById('category-container'), viewcategories, categorycolors, categoryfontcolors, 'sector-option');

const PredErrOptions = ['Show All', '5% or less', '10% or less', '20% or less'];
const PredErrColors = ['#ffffff','#ffffff','#ffffff','#ffffff'];
const PredErrFontColors = ['#000','#000','#000','#000'];
createCategoryButtons(document.getElementById('prederr-container'), PredErrOptions, PredErrColors, PredErrFontColors, 'prederr-option');

const sectorRadioButtons = document.querySelectorAll("input[name='sector-option']");
sectorRadioButtons.forEach(radioButton => {
  radioButton.addEventListener('click', changeCategory);
});
const PredErrRadioButtons = document.querySelectorAll("input[name='prederr-option']");
PredErrRadioButtons.forEach(radioButton => {
  radioButton.addEventListener('click', changePredErr);
});


function updateGraphics() {
  updateBubbleChart();
  updateTable();
  if (filterItem != '') filterTable('datatable');
}

function updateBubbleChart() {
  //const xExtent = [Math.log10(Math.max(d3.min(data, d => d.change)/100+1,0.00001)), Math.log10(d3.max(data, d => d.change)/100 + 1)];
  const xExtent = [0, currentXMax];
  const yExtent = [currentYMin, 0];
  const xScale = d3.scaleLinear().domain(xExtent).range([100, width - 100]);
  const yScale = d3.scaleLinear().domain(yExtent).range([height - 50, 50]);
  const radiusScale = d3.scaleSqrt().domain(d3.extent(data, d => d.mktcap)).range([2, 20]);
  chartRoot.selectAll('*').remove();
  const plotArea = chartRoot.append('g').attr('clip-path', 'url(#plot-clip)');
  if (true) {
    const textData = [{
      x: (xExtent[0] + xExtent[1]) / 2,
      y: yExtent[1],
      text: 'Expected annual growth (%)',
      anchorpos: 'middle',
      angle: 0,
      dx: '0',
      dy: '-20'
    }, {
      x: xExtent[0],
      y: (yExtent[0] + yExtent[1]) / 2,
      text: 'Drop from 52-wk high (%)',
      anchorpos: 'middle',
      angle: -90,
      dx: '0',
      dy: '-40'
    }, ];
    chartRoot.selectAll('text').data(textData).enter().append('text').attr('transform', d => 'rotate(' + d.angle + ' ' + xScale(d.x) + ' ' + yScale(d.y) + ')').attr('x', d => xScale(d.x)).attr('y', d => yScale(d.y)).text(d => d.text).attr('fill', 'black').attr('text-anchor', d => d.anchorpos).attr('dx', d => d.dx).attr('dy', d => d.dy).style('font-weight', 'bold');
  }
  if (true) {
    chartRoot.append('g').attr('class', 'x-axis').attr('transform', 'translate(0,50)').call(d3.axisBottom(xScale));
    chartRoot.append('g').attr('class', 'y-axis').attr('transform', 'translate(100,0)').call(d3.axisLeft(yScale));
  }

  {
    const selectedData = data.filter(d => d.opacity==1);
    if (selectedData.length == 1) {
        const item = selectedData[0];
        var line = d3.line()
            .x((d, j) => xScale(Math.min(item.AllRobustChange[j],MaxAnnualGrowthFold*100)))
            .y((d, j) => yScale(item.AllWorstDrop[j]));
        plotArea.append('path').datum(d3.range(item.datevalue.length)).attr('d', line).attr("fill", "none").attr("stroke", "gray").attr("stroke-width", 1).attr("stroke-dasharray", "1,1");
    }
  }

  if (showCategory == 'Show all') {
    //---------Add all circles ------------------------------
    data_filtered = data.filter(d => d.opacity != 1);
    bubbles = plotArea.selectAll('circle').data(data_filtered).enter().append('circle').on('click', pickItem)
          .attr('cx', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100)))
          .attr('cy', d => yScale(d.drop))
          .attr('r', d => radiusScale(d.mktcap)).attr('opacity', d => d.opacity).attr('fill', d => d.color).attr('stroke', d => (d.opacity == 1 ? 'grey' : 'none')).attr('stroke-width', 1);
    data_filtered = data.filter(d => d.opacity == 1);
    bubbles = plotArea.selectAll('circle1').data(data_filtered).enter().append('circle').on('mouseover', showTooltip).on('mousemove', showTooltip).on('click', pickItem).on('mouseout', hideTooltip).attr('cx', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100))).attr('cy', d => yScale(d.drop)).attr('r', d => radiusScale(d.mktcap)).attr('opacity', d => d.opacity).attr('fill', d => d.color).attr('stroke', d => (d.opacity == 1 ? 'grey' : 'none')).attr('stroke-width', 1);

    //---------Add labels for top 10 ---------------
    const top10Data = data.filter(d => d.rank >= 1 && d.rank <= 10 && d.opacity === 1); // Only show labels for fully opaque (selected or 'Show all') items
    plotArea.selectAll('.rank-label')
        .data(top10Data).enter().append('text')
        .attr('class', 'rank-label') // Add a class for specific styling/selection if needed
        .attr('x', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100)) + radiusScale(d.mktcap)+5) // Position label to the right of the bubble
        .attr('y', d => yScale(d.drop) + 5) // Adjust vertical position for better alignment
        .text(d => d.rank)
        .attr('fill', 'grey')
        .attr('font-size', '12px') // Adjust font size as needed
        .attr('font-weight', 'normal')
        .attr('text-anchor', 'start'); // Align text to the start (left)
  } else {
    data_filtered = data.filter(d => d.opacity != 1 && sectorMatches(d, showCategory) == false);
    bubbles = plotArea.selectAll('circle').data(data_filtered).enter().append('circle').attr('cx', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100))).attr('cy', d => yScale(d.drop)).attr('r', d => radiusScale(d.mktcap)).attr('opacity', d => d.opacity).attr('fill', d => d.color).attr('stroke', 'none').attr('stroke-width', 1);
    data_filtered = data.filter(d => d.opacity != 1 && sectorMatches(d, showCategory));
    bubbles = plotArea.selectAll('circle1').data(data_filtered).enter().append('circle').on('click', pickItem).attr('cx', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100))).attr('cy', d => yScale(d.drop)).attr('r', d => radiusScale(d.mktcap)).attr('opacity', d => d.opacity).attr('fill', d => d.color).attr('stroke', 'none').attr('stroke-width', 1);
    data_filtered = data.filter(d => d.opacity == 1);
    bubbles = plotArea.selectAll('circle2').data(data_filtered).enter().append('circle').on('mouseover', showTooltip).on('mousemove', showTooltip).on('click', pickItem).on('mouseout', hideTooltip).attr('cx', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100))).attr('cy', d => yScale(d.drop)).attr('r', d => radiusScale(d.mktcap)).attr('opacity', d => d.opacity).attr('fill', d => d.color).attr('stroke', 'grey').attr('stroke-width', 1);

    //---------Add labels for top 10 ---------------
    const top10Data = data.filter(d => d.rank >= 1 && d.rank <= 10 && d.opacity === 1 && sectorMatches(d, showCategory)); // Only show labels for fully opaque (selected or 'Show all') items
    plotArea.selectAll('.rank-label')
        .data(top10Data).enter().append('text')
        .attr('class', 'rank-label') // Add a class for specific styling/selection if needed
        .attr('x', d => xScale(Math.min(d.change,MaxAnnualGrowthFold*100)) + radiusScale(d.mktcap)+5) // Position label to the right of the bubble
        .attr('y', d => yScale(d.drop) + 5) // Adjust vertical position for better alignment
        .text(d => d.rank)
        .attr('fill', 'grey')
        .attr('font-size', '12px') // Adjust font size as needed
        .attr('font-weight', 'normal')
        .attr('text-anchor', 'start'); // Align text to the start (left)
  }
}

function updateTable() {
  const container = document.getElementById('table-container');
  const table = document.createElement('table');
  table.className = 'datatable';
  table.id = 'datatable';
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const columns = ['Rank', 'Symbol', 'Company', 'Sector', 'Market Cap', 'Expected annual growth', 'Drop from 52-wk high'];
  const columnwidth = ['5%', '10%', '30%', '30%', '5%', '10%', '10%'];
  columns.forEach((column, index) => {
    const th = document.createElement('th');
    th.dataset.index = index;
    th.innerHTML = column + (index == 2 ? '&nbsp;&nbsp;' + '<input type=\'text\' id=\'filterName\' placeholder=\'Filter by name\' value=\'' + filterItem + '\'>' + '<button id=\'filterNameCancel\'>X</button>' : '') + '<BR>' + '<A onclick=\'sortTable(\"datatable\",' + index + ',true )\'>&#9650;</A>' + '<A onclick=\'sortTable(\"datatable\",' + index + ',false)\'>&#9660;</A>';
    th.style.width = columnwidth[index];
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  if (true) {
    const tbody = document.createElement('tbody');
    data.forEach(d => {
      if (d.opacity != lo_opacity) {
        const tr = document.createElement('tr');
        td = document.createElement('td');
        td.textContent = d.rank;
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);
        td = document.createElement('td');
        td.textContent = d.symbol;
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);        
        td = document.createElement('td');
        td.textContent = d.name;
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);
        td = document.createElement('td');
        td.textContent = d.sector;
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);
        td = document.createElement('td');
        td.textContent = (d.mktcap > 1000000000000 ? (d.mktcap / 1000000000000).toFixed(1) + 'T' : (d.mktcap > 1000000000 ? (d.mktcap / 1000000000).toFixed(1) + 'B' : (d.mktcap > 1000000 ? (d.mktcap / 1000000).toFixed(1) + 'M' : d.mktcap.toFixed(0))));
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);
        td = document.createElement('td');
        td.textContent = d.change.toFixed(1) + '%';
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);
        td = document.createElement('td');
        td.textContent = d.drop.toFixed(1) + '%';
        if (d.opacity == mid_opacity) td.style.color = '#A0A0A0';
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    });
    table.appendChild(tbody);
  }
  container.innerHTML = '';
  container.appendChild(table);
  table.addEventListener('click', (event) => {
    const target = event.target;
    if (target.tagName === 'TD') {
      const row = target.parentNode;
      const firstCell = row.cells[1]; // symbol      
      const content = firstCell.textContent;
      if (highlightItem == content) {
        highlightItem = null;
      } else {
        highlightItem = content;
      }
      updateOpacity();
      updateGraphics();
    }
  });
  document.getElementById('filterName').addEventListener('keyup', function() {
    filterTable('datatable');
  });
  document.getElementById('filterNameCancel').addEventListener('click', function() {
    document.getElementById('filterName').value = '';
    filterTable('datatable');
  });
  return table;
}

function filterTable(tableid) {
  const table = document.getElementById(tableid);
  const tbody = table.querySelector('tbody');
  const filterInput = document.getElementById('filterName');
  filterItem = filterInput.value;
  const filterValue = filterItem.toLowerCase();
  const rows = tbody.getElementsByTagName('tr');
  var NumSelected=0;
  var LastChosen=-1;

  for (let i = 0; i < rows.length; i++) {
    const nameCell = rows[i].getElementsByTagName('td')[1];
    const name = nameCell.textContent.toLowerCase();
    if (name.includes(filterValue)) {
      rows[i].style.display = '';
      NumSelected=NumSelected+1;
      LastChosen = i;
    } else {
      rows[i].style.display = 'none';
    }
  }
  if (NumSelected==1) {
    highlightItem = rows[LastChosen].getElementsByTagName('td')[1].textContent; // symbol
  } else {
    highlightItem = null;
  }
  updateOpacity();
  updateBubbleChart();
}

function sortTable(tableid, columnIndex, ascending = true) {
  const table = document.getElementById(tableid);
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  if (columnIndex == 0) {
    // Rank: plain integer
    rows.sort((a, b) => {
      const cellA = parseInt(a.cells[columnIndex].textContent);
      const cellB = parseInt(b.cells[columnIndex].textContent);
      if (ascending) {
        return (cellA < cellB ? -1 : (cellA > cellB ? 1 : 0))
      } else {
        return (cellA < cellB ? 1 : (cellA > cellB ? -1 : 0))
      }
    });
  } else if (columnIndex == 5 || columnIndex == 6) {
    // Expected annual growth / Drop from 52-wk high: percentages, can be negative and decimal
    rows.sort((a, b) => {
      const cellA = parseFloat(a.cells[columnIndex].textContent);
      const cellB = parseFloat(b.cells[columnIndex].textContent);
      if (ascending) {
        return (cellA < cellB ? -1 : (cellA > cellB ? 1 : 0))
      } else {
        return (cellA < cellB ? 1 : (cellA > cellB ? -1 : 0))
      }
    });
  } else if (columnIndex == 4) {
    // Market Cap: has a T/B/M suffix
    rows.sort((a, b) => {
      const strA = a.cells[columnIndex].textContent;
      const strB = b.cells[columnIndex].textContent;
      const cellA = (strA.charAt(strA.length - 1) == 'T' ? parseInt(strA.slice(0, -1)) * 1000000000000 : (strA.charAt(strA.length - 1) == 'B' ? parseInt(strA.slice(0, -1)) * 1000000000 : (strA.charAt(strA.length - 1) == 'M' ? parseInt(strA.slice(0, -1)) * 1000000 : parseInt(strA))));
      const cellB = (strB.charAt(strB.length - 1) == 'T' ? parseInt(strB.slice(0, -1)) * 1000000000000 : (strB.charAt(strB.length - 1) == 'B' ? parseInt(strB.slice(0, -1)) * 1000000000 : (strB.charAt(strB.length - 1) == 'M' ? parseInt(strB.slice(0, -1)) * 1000000 : parseInt(strB))));
      if (ascending) {
        return (cellA < cellB ? -1 : (cellA > cellB ? 1 : 0))
      } else {
        return (cellA < cellB ? 1 : (cellA > cellB ? -1 : 0))
      }
    });
  } else {
    // Symbol / Company / Sector: plain string compare
    rows.sort((a, b) => {
      const cellA = a.cells[columnIndex].textContent;
      const cellB = b.cells[columnIndex].textContent;
      const compare = cellA.localeCompare(cellB);
      return ascending ? compare : -compare;
    });
  }
  tbody.innerHTML = '';
  rows.forEach(row => tbody.appendChild(row));
  const th = document.querySelector(`th[data-index='${columnIndex}']`);
  th.dataset.sorted = ascending ? 'desc' : 'asc';
}

function showTooltip(event, d) {
  const tooltip = d3.select('#tooltip');
  if (d.opacity == 1) {
    const mktcaptxt = (d.mktcap > 1000000000000 ? (d.mktcap / 1000000000000).toFixed(1) + 'T' : (d.mktcap > 1000000000 ? (d.mktcap / 1000000000).toFixed(1) + 'B' : (d.mktcap > 1000000 ? (d.mktcap / 1000000).toFixed(1) + 'M' : d.mktcap.toFixed(0))));
    tooltip.html(`<TABLE class=tooltip><TR><TD COLSPAN=2>${d.rank}. <strong>${d.name}</strong> (${d.symbol})</TD></TR><TR><TD COLSPAN=2><FONT COLOR=#808080>${d.sector}</FONT></TD></TR><TR><TD>Expected annual growth</TD><TD>${d.change}%</TD></TR><TR><TD>10%-ile drop from 52wk high</TD><TD>${d.drop}%</TD></TR><TR><TD>Market cap</TD><TD>${mktcaptxt}</TD></TR><TR><TD>Prediction error</sup></TD><TD>${d.AllPredErr[0]}%</TD></TR><TR><TD colspan=2><div id=insetchart></div></TD></TR></TABLE>`)
         .style('left', (event.pageX + 10) + 'px').style('top', (event.pageY - 20) + 'px').style('display', null).style('opacity', 1);
    updateInsetChart(d);
  }
}
function updateInsetChart(data) {
  const insetwidth = 300;
  const insetheight = 200;
  const insetmargx = 40
  const insetmargy = 30

  svg2 = d3.select('#insetchart').select('svg');
  // If no SVG exists, create a new one
  if (svg2.empty()) {
     svg2 = d3.select('#insetchart').append('svg').attr('width', insetwidth).attr('height', insetheight);
  }

  //const yMin = Math.min(...data.loss, ...data.traj, ...data.price);
  //const yMax = Math.max(...data.loss, ...data.traj, ...data.price);
  const yExtent = [-100, 20]; // [yMin, yMax]; 
  const yScale = d3.scaleLinear().domain(yExtent).range([insetheight - insetmargy*1.5, insetmargy*0.5]);

  const xExtent = [Math.min(...data.datevalue), Math.max(...data.datevalue)];
  const xScale = d3.scaleTime().domain(xExtent).range([insetmargx, insetwidth - insetmargx]);

  svg2.selectAll('*').remove();
  if (true) { // axes
    svg2.append('g')
	.attr('class', 'x-axis').attr('transform', `translate(0, ${insetheight - insetmargy*1.5} )`)
	.call(d3.axisBottom(xScale).tickFormat(d3.timeFormat("%b'%y")))
	.selectAll('text').style('text-anchor', 'end').attr('transform', 'rotate(-45)');
    svg2.append('g').attr('class', 'y-axis').attr('transform', `translate(${insetmargx},0)`).call(d3.axisLeft(yScale).ticks(5));
  }

  const axisY = [0,0];
  var line = d3.line().x((d, i) => xScale(xExtent[i])).y((d, i) => yScale(axisY[i]));
  svg2.append('path').datum(d3.range(2)).attr('d', line).attr("fill", "none").attr("stroke", "black").attr("stroke-width", 1).attr("stroke-dasharray", "1,1");

  line = d3.line().x((d, i) => xScale(data.datevalue[i])).y((d, i) => yScale(data.loss[i]));
  svg2.append('path').datum(d3.range(data.datevalue.length)).attr('d', line).attr("fill", "none").attr("stroke", "#c00000").attr("stroke-width", 1).attr("stroke-dasharray", "1,1");

  line = d3.line().x((d, i) => xScale(data.datevalue[i])).y((d, i) => yScale(data.traj[i]));
  svg2.append('path').datum(d3.range(data.datevalue.length)).attr('d', line).attr("fill", "none").attr("stroke", "blue").attr("stroke-width", 1).attr("stroke-dasharray", "5,5");
  
  line = d3.line().x((d, i) => xScale(data.datevalue[i])).y((d, i) => yScale(data.price[i]));
  svg2.append('path').datum(d3.range(data.datevalue.length)).attr('d', line).attr("fill", "none").attr("stroke", "blue").attr("stroke-width", 2);
}
function showHelpInfo(event) {
  const tooltip = d3.select('#tooltip');
  tooltip.html('This analysis identifies stocks with steady growth trends,using:' + '<LI>a conservative approach to identify consistent growth</LI>' + '<LI>a 10th percentile threadhold to assess potential loss from 52-wk highs due to poor timing</LI>').style('left', (event.pageX) + 'px').style('top', (event.pageY) + 'px').style('display', null).style('opacity', 1).on('mouseleave', hideTooltip);
}

function pickItem(event, d) {
  showTooltip(event, d);
  if (highlightItem == null) {
    highlightItem = d.symbol;
  } else if (highlightItem == d.symbol) {
    highlightItem = null;
  } else if (sectorMatches(d, showCategory)) {
    highlightItem = d.symbol;
  }
  updateOpacity();
  updateGraphics();
}

function clickChart(event, d) {
  if (event.target.tagName == 'circle') {
    pickItem(event, d);
  } else {
    highlightItem = null;
    hideTooltip();
    updateOpacity();
    updateGraphics();
  }
}

function debugmessage(testmessage) {
  const tooltip = d3.select('#tooltip');
  tooltip.html('MESSAGE: ' + testmessage).style('left', (10) + 'px').style('top', (20) + 'px').transition().duration(0).style('display', null).transition().duration(0).style('opacity', 1);
}

function hideTooltip() {
  d3.select('#tooltip').style('opacity', 0).style('display', 'none');
}
updateGraphics();
sortTable('datatable', 0, true);
      
</script>
