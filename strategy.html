<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy.com mNav Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-purple: #a855f7;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px 16px;
            font-family: var(--font-family);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        #appContainer {
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Top Header Navigation Bar */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            margin: 4px 0 0 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .timestamp-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.825rem;
            font-weight: 500;
        }

        /* Metric Summary Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }

        .metric-label {
            font-size: 0.825rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .metric-value {
            font-size: 1.85rem;
            font-weight: 700;
            margin-top: 8px;
            color: var(--text-primary);
        }

        /* Charts Layout */
        #chartContainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        .chart-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow);
            height: 440px;
            position: relative;
        }

        @media (max-width: 960px) {
            #chartContainer {
                grid-template-columns: 1fr;
            }
        }

        #debug {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            min-height: 20px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>

<div id="appContainer">
    <div class="dashboard-header">
        <div class="header-title">
            <h1>Strategy.com mNav Dashboard</h1>
            <p>Real-time corporate treasury & NAV analytics</p>
        </div>
        <div id="Timestamp" class="timestamp-badge">Awaiting data...</div>
    </div>

    <!-- Stat Cards Summary Bar -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">mNav Ratio</div>
            <div id="kpi-mnav" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Enterprise Value ($M)</div>
            <div id="kpi-ev" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">BTC Reserve ($M)</div>
            <div id="kpi-btc" class="metric-value">--</div>
        </div>
    </div>

    <!-- Chart Grid Section -->
    <div id="chartContainer">
        <div class="chart-wrapper">
            <canvas id="myChart1"></canvas>
        </div>
        <div class="chart-wrapper">
            <canvas id="myChart2"></canvas>
        </div>
    </div>
    
    <div id="debug"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, getDocs, query, where, writeBatch, orderBy, onSnapshot, Timestamp, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

document.addEventListener('DOMContentLoaded', async () => {
    await initializeFirebase("strategy.com");
});

function updateCharts() {
    const data = getFirebaseData();
    if (!data || data.length === 0) return;

    // 1. Sort data to find the most recent entry
    const sorted = [...data].sort((a, b) => b.Timestamp - a.Timestamp);
    const latest = sorted[0];

    // 2. Update Header Timestamp & Cards
    document.getElementById("Timestamp").innerText = `Updated ${latest['Timestamp'].toLocaleString()}`;
    
    const latestMNav = latest['mNav'] ? latest['mNav'].toFixed(3) : '--';
    const latestBTCreserve = latest['BTC Reserve'] ? latest['BTC Reserve'].toLocaleString() : '--';
    const latestEV = latest['Enterprise Value'] ? latest['Enterprise Value'].toLocaleString() : '--';

    document.getElementById("kpi-mnav").innerText = latestMNav !== '--' ? `${latestMNav}x` : '--';
    document.getElementById("kpi-ev").innerText = latestEV !== '--' ? `$${latestEV}` : '--';
    document.getElementById("kpi-btc").innerText = latestBTCreserve !== '--' ? `$${latestBTCreserve}` : '--';

    // Update Chart 1 (mNav)
    updateChart(data, `mNav Multiple Trajectory`, 'myChart1', ['mNav']);
    
    // Update Chart 2 (Combined EV and BTC Reserve sharing single Y-scale)
    updateChart(data, `Enterprise Value vs. BTC Reserve ($M)`, 'myChart2', ['Enterprise Value', 'BTC Reserve']);    
}

const chartInstances = {};
let activeHoverX = null; // Shared synchronized hover state across charts

// Custom Chart.js plugin to draw vertical crosshair line across linked charts
const crosshairPlugin = {
    id: 'crosshair',
    afterDraw: (chart) => {
        if (activeHoverX !== null && chart.chartArea) {
            const { top, bottom } = chart.chartArea;
            const xScale = chart.scales.x;
            const xPixel = xScale.getPixelForValue(activeHoverX);

            if (xPixel >= chart.chartArea.left && xPixel <= chart.chartArea.right) {
                const ctx = chart.ctx;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(xPixel, top);
                ctx.lineTo(xPixel, bottom);
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = 'rgba(248, 250, 252, 0.5)';
                ctx.stroke();
                ctx.restore();
            }
        }
    }
};

Chart.register(crosshairPlugin);

function createGradient(ctx, colorStart, colorEnd) {
    const gradient = ctx.createLinearGradient(0, 0, 0, 350);
    gradient.addColorStop(0, colorStart);
    gradient.addColorStop(1, colorEnd);
    return gradient;
}

function updateChart(data, title, chartId, measures) {
    const canvas = document.getElementById(chartId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const sortedData = [...data].sort((a, b) => {
        const timeA = a.Timestamp instanceof Date ? a.Timestamp.getTime() : new Date(a.Timestamp).getTime();
        const timeB = b.Timestamp instanceof Date ? b.Timestamp.getTime() : new Date(b.Timestamp).getTime();
        return timeA - timeB;
    });

    const styleConfigs = {
        'mNav': { border: '#38bdf8', fillStart: 'rgba(56, 189, 248, 0.25)', fillEnd: 'rgba(56, 189, 248, 0.0)' },
        'Enterprise Value': { border: '#818cf8', fillStart: 'rgba(129, 140, 248, 0.15)', fillEnd: 'rgba(129, 140, 248, 0.0)' },
        'BTC Reserve': { border: '#34d399', fillStart: 'rgba(52, 211, 153, 0.15)', fillEnd: 'rgba(52, 211, 153, 0.0)' }
    };

    const datasets = measures.map((measure) => {
        const style = styleConfigs[measure] || { border: '#94a3b8', fillStart: 'transparent', fillEnd: 'transparent' };
        return {
            label: measure,
            data: sortedData
                .filter(entry => entry[measure] !== undefined)
                .map(entry => ({
                    x: entry.Timestamp instanceof Date ? entry.Timestamp.getTime() : new Date(entry.Timestamp).getTime(),
                    y: entry[measure]
                })),
            borderColor: style.border,
            backgroundColor: createGradient(ctx, style.fillStart, style.fillEnd),
            borderWidth: 2.5,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: style.border,
            fill: true,
            tension: 0.35
        };
    });

    const options = {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
            title: { 
                display: true, 
                text: title, 
                color: '#f8fafc',
                font: { family: 'Inter', size: 15, weight: '600' },
                padding: { bottom: 20 },
                align: 'start'
            },
            legend: { 
                display: measures.length > 1,
                position: 'top',
                align: 'end',
                labels: { color: '#94a3b8', usePointStyle: true, pointStyle: 'circle' }
            },
            tooltip: {
                backgroundColor: '#0f172a',
                titleColor: '#f8fafc',
                bodyColor: '#cbd5e1',
                borderColor: '#334155',
                borderWidth: 1,
                padding: 12,
                boxPadding: 6,
                usePointStyle: true,
                callbacks: {
                    label: function(context) {
                        let label = context.dataset.label || '';
                        if (label) {
                            label += ': ';
                        }
                        if (context.parsed.y !== null) {
                            const val = context.parsed.y;
                            // Check if the current measure is mNav or EV/BTC Reserve
                            if (context.dataset.label === 'mNav') {
                                label += val.toFixed(3);
                            } else {
                                // Formats with commas and 0 decimal places
                                label += Math.round(val).toLocaleString();
                            }
                        }
                        return label;
                    }
                }
            }
        },
        scales: {
            x: { 
                type: 'time', 
                time: { unit: 'day', displayFormats: { day: 'MMM d' } },
                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                ticks: { color: '#94a3b8', font: { family: 'Inter', size: 11 } }
            },
            y: { 
                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                ticks: { color: '#94a3b8', font: { family: 'Inter', size: 11 }, callback: (val) => val.toLocaleString() } 
            }
        }
    };

    if (chartInstances[chartId]) {
        chartInstances[chartId].data.datasets = datasets;
        chartInstances[chartId].options = options;
        chartInstances[chartId].update();
    } else {
        const chart = new Chart(ctx, {
            type: 'line',
            data: { datasets },
            options: options
        });
        chartInstances[chartId] = chart;

        // Synchronized Hover Event Listeners
        canvas.addEventListener('mousemove', (e) => {
            const points = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
            if (points.length > 0) {
                const hoveredPoint = points[0];
                const xVal = chart.data.datasets[hoveredPoint.datasetIndex].data[hoveredPoint.index].x;
                syncHover(xVal);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            syncHover(null);
        });
    }
}

// Function to trigger callout tooltip and crosshair line on all charts simultaneously
function syncHover(xVal) {
    activeHoverX = xVal;

    Object.keys(chartInstances).forEach(id => {
        const chart = chartInstances[id];

        if (xVal === null) {
            chart.setActiveElements([]);
            chart.tooltip.setActiveElements([], { x: 0, y: 0 });
            chart.draw();
            return;
        }

        // Find nearest data point index for xVal
        const dataset = chart.data.datasets[0];
        if (!dataset || !dataset.data) return;

        let closestIdx = 0;
        let minDiff = Infinity;

        dataset.data.forEach((pt, idx) => {
            const diff = Math.abs(pt.x - xVal);
            if (diff < minDiff) {
                minDiff = diff;
                closestIdx = idx;
            }
        });

        const activeElements = chart.data.datasets.map((_, dsIdx) => ({
            datasetIndex: dsIdx,
            index: closestIdx
        }));

        // 1. Set active elements on datasets
        chart.setActiveElements(activeElements);

        // 2. Target exact pixel position on the chart scale for tooltip tracking
        const targetXPixel = chart.scales.x.getPixelForValue(xVal);
        const targetYPixel = chart.scales.y.getPixelForValue(chart.data.datasets[0].data[closestIdx].y);

        // 3. Set active elements for tooltip and FORCE an update so the tooltip box repositions
        chart.tooltip.setActiveElements(activeElements, {
            x: targetXPixel,
            y: targetYPixel
        });
        chart.tooltip.update(true);

        // 4. Render updated crosshair and tooltip box
        chart.draw();
    });
}

// Initialize Firebase Configuration
let firebase = {
    firebaseConfig: {
        apiKey: "AIzaSyA9k81iD2mzPuLKBl76d6sdcLWvguDBzcs",
        authDomain: "kids-15b5a.firebaseapp.com",
        projectId: "kids-15b5a",
        storageBucket: "kids-15b5a.firebasestorage.app",
        messagingSenderId: "350263998718",
        appId: "1:350263998718:web:8c1d356caa2df0da99cdaf",
        measurementId: "G-7CM04QF69W",
    },
    initialAuthToken: null,
    app: null,
    db: null,
    auth: null,
    isAuthReady: false,
    userUid: null,
    collectionName: null,
};

async function initializeFirebase(collectionName) {
    try {
        firebase.collectionName = collectionName;
        firebase.app = initializeApp(firebase.firebaseConfig);
        firebase.db = getFirestore(firebase.app);
        firebase.auth = getAuth(firebase.app);

        onAuthStateChanged(firebase.auth, async (user) => {
            if (user) {
                firebase.userUid = user.uid;
                firebase.isAuthReady = true;
                console.log(`→ Firebase user ID: ${firebase.userUid}`);
                loadFirebaseData();
            } else {
                if (firebase.initialAuthToken) {
                    await signInWithCustomToken(firebase.auth, firebase.initialAuthToken);
                } else {
                    try {
                        await signInAnonymously(firebase.auth);
                    } catch (error) {
                        console.error("✗ Anonymous sign-in failed:", error.code, error.message);
                        return null;
                    } finally {
                        console.log(`✓ Anonymous sign-in to firebase.`);
                    }
                }
            }
        });
    } catch (error) {
        debug(`✗ Error initializing Firebase: ${error}`);
    }
}

let FirebaseData = [];

function loadFirebaseData() {    
    if (!firebase.isAuthReady || !firebase.userUid) {
        debug(`→ Waiting for authentication...`);
        return;
    }

    const messagesCollectionRef = collection(firebase.db, `artifacts/${firebase.firebaseConfig.appId}/public/data/${firebase.collectionName}`);     
    const q = query(messagesCollectionRef);
    
    onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
            debug(`⚠ No data available...`);
            return;
        }
        snapshot.docChanges().forEach((change) => {
            if (change.type == 'added') {
                let newentry = createRowDataFromChange(change);
                FirebaseData.push(newentry);
            } else if (change.type == 'removed') {
                FirebaseData = FirebaseData.filter(entry => entry['docID'] !== change.doc.id);
            } else if (change.type == 'modified') {
                let newentry = createRowDataFromChange(change);
                FirebaseData = FirebaseData.map(item => {
                    if (item['docID'] === change.doc.id) return newentry;
                    return item;
                });
            }
        });
        updateCharts();
    }, (error) => {
        console.error(`✗ Error fetching data: ${error}`);
    });
}

function getFirebaseData() {
    return FirebaseData;
}

function createRowDataFromChange(change) {
    const row = change.doc.data();
    let newentry = { docID: change.doc.id };

    const keys = Object.keys(row).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

    keys.forEach(key => {
        if (key.toLowerCase() === 'date' || key.toLowerCase() === 'timestamp' || key.toLowerCase() === 'time stamp') {
            if (row[key] instanceof Timestamp) {
                newentry[key] = new Date(row[key].seconds * 1000 + row[key].nanoseconds / 1000000);
            } else {
                newentry[key] = new Date(row[key]);
            }
        } else if (key === 'value') {
            newentry[key] = Number(row[key]);
        } else {
            newentry[key] = row[key];
        }
    });
    return newentry;
}

function debug(msg) {
    const debugEl = document.getElementById("debug");
    debugEl.innerHTML = msg;
    if (msg.toLowerCase().includes('error')) {
        debugEl.style.color = "#f87171";
    } else {
        debugEl.style.color = "#94a3b8";
        setTimeout(() => { debugEl.innerHTML = ''; }, 5000);
    }
}
</script>
</body>
</html>
